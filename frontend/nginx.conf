# Entrypoint único da aplicação: serve a SPA e encaminha /api para o backend.
# Fica atrás de um reverse proxy externo (Nginx Proxy Manager, Caddy, LB) que
# faz TLS + domínio.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    # Download de backups (arquivos .gpg grandes): repassa em streaming, sem
    # bufferizar em disco no nginx, e sem timeout curto.
    location ~ ^/api/backups/[0-9]+/components/[0-9]+/download$ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering    off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
    }

    # Envio por HTTPS do cliente Windows: pedaços de até 32 MiB, repassados em
    # streaming (sem bufferizar em disco no nginx).
    location ^~ /api/agent/ {
        client_max_body_size 40m;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Downloads: o administrador envia o instalador do Windows (até 512 MB) e os
    # arquivos saem em streaming. SEM barra no fim: com barra + proxy_pass o nginx
    # responde 301 a /api/downloads (a lista) apontando para http://…:8080/, que o
    # navegador bloqueia ("Failed to fetch").
    location ^~ /api/downloads {
        client_max_body_size 512m;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # FTP Firmwares: o administrador envia imagens grandes (limite real no backend,
    # FIRMWARE_MAX_MB), repassadas em streaming.
    location ^~ /api/firmware {
        client_max_body_size 8g;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API -> backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # repassa o esquema visto pelo proxy externo (https no NPM); http se ausente
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Não sirva arquivos ocultos nem markdown que possam ir para public/
    location ~ /\.        { return 404; }
    location ~* \.md$     { return 404; }

    # Assets com hash no nome: cache agressivo (o add_header próprio faz o nginx
    # NÃO herdar os add_header do server — inclusive o Cache-Control abaixo).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (React Router). O index.html NÃO tem hash no nome; sem isto o
    # navegador (ou o proxy externo) pode servir uma versão antiga apontando para
    # bundles que já não existem. "no-cache" = pode guardar, mas revalida sempre.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Cabeçalhos de segurança para o HTML/JS servido daqui.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
